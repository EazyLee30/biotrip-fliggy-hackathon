<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f9f9ff">
    <title>BioTrip · 暂时离线</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #141b2b; background: #f9f9ff; font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { width: min(360px, 100%); padding: 30px; border: 1px solid #e4eae2; border-radius: 24px; background: #ffffff; text-align: center; box-shadow: 0 18px 45px rgba(42, 76, 58, .08); }
      img { width: 58px; height: 58px; margin-bottom: 12px; }
      h1 { margin: 0 0 8px; font: 500 25px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      p { margin: 0 0 18px; color: #718078; font-size: 13px; }
      button { border: 0; border-radius: 8px; padding: 11px 16px; color: #fff; background: #006948; font: inherit; font-size: 13px; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #9ba69b; font-size: 10px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/biotrip-icon.svg" alt="">
      <h1>路上暂时没有网络</h1>
      <p>连上网络后，可以继续查看已保存在账号里的旅程、偏好与建议。</p>
      <button onclick="location.reload()">重新连接</button>
      <small>这趟旅程，慢一点也没关系。</small>
    </main>
  </body>
</html>
