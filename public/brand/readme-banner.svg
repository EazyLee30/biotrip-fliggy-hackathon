<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">BioTrip — Travel at your own rhythm</title><desc id="desc">A soft sage landscape, a travel card and a route connecting West Lake and Lingyin Temple.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef3e9"/><stop offset="1" stop-color="#e2ece5"/></linearGradient>
<linearGradient id="lake" x2="0" y2="1"><stop stop-color="#c3d9d1"/><stop offset="1" stop-color="#e4eee7"/></linearGradient>
<linearGradient id="card" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f7ee"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#294a40" flood-opacity=".10"/></filter>
<clipPath id="round"><rect width="1600" height="600" rx="30"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1600" height="600" fill="url(#bg)"/>
<circle cx="1470" cy="64" r="270" fill="#f7f4df" opacity=".65"/>
<path d="M670 370Q890 120 1150 330T1660 260V600H670Z" fill="#c7d9c8" opacity=".5"/>
<path d="M730 430Q1030 240 1230 420T1650 345V600H730Z" fill="#b7cbbd" opacity=".5"/>
<path d="M0 508Q390 443 740 512T1600 470V600H0Z" fill="url(#lake)"/>
<path d="M0 542Q400 476 780 549T1600 510" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="92" y="83" width="42" height="42" rx="14" fill="#254e42"/>
<path d="M102 108h7l4-12 5 18 4-9h4" fill="none" stroke="#eef5dd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="149" y="111" fill="#466653" font-size="15" font-weight="700" letter-spacing="3">YOUR JOURNEY. YOUR RHYTHM.</text>
<text x="86" y="249" fill="#234c3f" font-size="112" font-weight="700" letter-spacing="-6">BioTrip<tspan fill="#8ca66e">.</tspan></text>
<text x="93" y="309" fill="#456457" font-size="31" letter-spacing="-.5">A gentler way to explore.</text>
<text x="94" y="354" fill="#6a7f70" font-size="19">Real places. Flexible plans. A little room to breathe.</text>
<g font-size="13" fill="#355b4a" font-weight="700" letter-spacing="1">
<rect x="94" y="401" width="139" height="36" rx="18" fill="#fff" opacity=".7"/><text x="113" y="424">AI TRAVEL</text>
<rect x="244" y="401" width="147" height="36" rx="18" fill="#fff" opacity=".7"/><text x="264" y="424">REAL SOURCES</text>
<rect x="402" y="401" width="150" height="36" rx="18" fill="#fff" opacity=".7"/><text x="422" y="424">YOUR CHOICE</text>
</g>
<g filter="url(#shadow)">
<rect x="947" y="96" width="384" height="395" rx="28" fill="url(#card)" transform="rotate(4 1139 294)"/>
<rect x="874" y="107" width="390" height="396" rx="28" fill="url(#card)"/>
</g>
<text x="905" y="150" fill="#829482" font-size="11" font-weight="700" letter-spacing="2">A DAY IN HANGZHOU</text>
<text x="905" y="191" fill="#254e42" font-size="28" font-weight="700">Leave room for yourself.</text>
<path d="M933 237V365" stroke="#bfceb4" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="933" cy="240" r="7" fill="#456c55"/><circle cx="933" cy="301" r="7" fill="#bbcea5"/><circle cx="933" cy="364" r="7" fill="#456c55"/>
<text x="958" y="235" fill="#254e42" font-size="18" font-weight="700">West Lake</text>
<text x="958" y="259" fill="#829482" font-size="13">A slow morning by the water</text>
<text x="958" y="298" fill="#456c55" font-size="17">Take the gentler route</text>
<text x="958" y="321" fill="#829482" font-size="13">Verified by Amap · less walking</text>
<text x="958" y="361" fill="#254e42" font-size="18" font-weight="700">Lingyin Temple</text>
<text x="958" y="385" fill="#829482" font-size="13">Keep what matters. Adjust the rest.</text>
<rect x="904" y="416" width="330" height="57" rx="17" fill="#eaf0e1"/>
<circle cx="929" cy="444" r="10" fill="#d6e3bf"/><path d="m925 444 3 3 6-7" fill="none" stroke="#557145" stroke-width="2" stroke-linecap="round"/>
<text x="950" y="448" fill="#456447" font-size="14" font-weight="700">You decide what goes into your plan.</text>
<text x="94" y="553" fill="#6b8676" font-size="12" font-weight="700" letter-spacing="2">BUILT WITH BAILIAN · FLIGGY · AMAP · CLOUDFLARE</text>
</g></g></svg>
